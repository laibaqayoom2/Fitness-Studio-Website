<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FFL Studio | Fitness &amp; Personal Training</title>
    <meta
      name="description"
      content="FFL Studio is a fitness and personal training studio with expert coaches, 60+ weekly classes, strength and cardio equipment, swimming and recovery."
    />
    <meta name="theme-color" content="#1b1d22" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="FFL Studio" />
    <meta property="og:title" content="FFL Studio | Fitness &amp; Personal Training" />
    <meta
      property="og:description"
      content="Expert coaches, 60+ weekly classes, strength and cardio equipment, swimming and recovery. Push your limits with us."
    />
    <meta property="og:image" content="/images/hero-athlete.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Theme bootstrap: must run before first paint so the correct theme class
         is on <html> immediately (no flash of the wrong theme on refresh). -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('ffl-theme')
          var theme = stored === 'light' || stored === 'dark'
            ? stored
            : (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
          document.documentElement.classList.add(theme)
        } catch (e) {
          document.documentElement.classList.add('dark')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
